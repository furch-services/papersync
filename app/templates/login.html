<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperSync – Login</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Syne';
      src: url('/static/fonts/Syne.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Epilogue';
      src: url('/static/fonts/Epilogue.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --ps-bg: #f4f3f0;
      --ps-primary: #2f84ff;
      --ps-dark: #041834;
    }
    body { background: var(--ps-bg); font-family: 'Epilogue', sans-serif; }
    .login-card { max-width: 380px; }
    .btn-primary { background-color: var(--ps-dark); border-color: var(--ps-dark); }
    .btn-primary:hover { background-color: #062040; border-color: #062040; }
    .login-logo { height: 36px; width: auto; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-card w-100 px-3">
    <div class="text-center mb-4">
      <img src="/static/img/logo.svg" alt="PaperSync" class="login-logo">
    </div>
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Benutzername</label>
            <input type="text" name="username" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Passwort</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            Anmelden
          </button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
