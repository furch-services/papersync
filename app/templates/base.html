<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PaperSync{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
    .sidebar { min-height: calc(100vh - 56px); background: #212529; }
    .sidebar .nav-link { color: rgba(255,255,255,.65); border-radius: 6px; margin-bottom: 2px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.1); }
    .sidebar .nav-link i { width: 20px; }
    .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .log-DEBUG { color: #6c757d; }
    .log-INFO { color: #0d6efd; }
    .log-WARNING { color: #fd7e14; }
    .log-ERROR { color: #dc3545; }
    .log-CRITICAL { color: #6f42c1; font-weight: 600; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="/dashboard">
    <i class="bi bi-arrow-repeat me-1"></i>PaperSync
  </a>
</nav>
<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 sidebar p-3">
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link {% if request.url.path in ['/', '/dashboard'] %}active{% endif %}" href="/dashboard">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/settings' in request.url.path %}active{% endif %}" href="/settings">
            <i class="bi bi-gear"></i> Einstellungen
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/logs' in request.url.path %}active{% endif %}" href="/logs">
            <i class="bi bi-journal-text"></i> Logs
          </a>
        </li>
      </ul>
    </nav>
    <main class="col-md-10 p-4">
      {% if request.query_params.get('saved') %}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> Einstellungen gespeichert.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endif %}
      {% if request.query_params.get('syncing') %}
      <div class="alert alert-info alert-dismissible fade show" role="alert">
        <i class="bi bi-arrow-repeat"></i> Synchronisation gestartet…
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
