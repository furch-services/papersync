<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PaperSync{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <style>
    @font-face {
      font-family: 'Syne';
      src: url('/static/fonts/Syne.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Epilogue';
      src: url('/static/fonts/Epilogue.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --ps-bg: #f4f3f0;
      --ps-primary: #2f84ff;
      --ps-dark: #041834;
    }

    body { background: var(--ps-bg); font-family: 'Epilogue', sans-serif; }
    h1, h2, h3, h4, h5, h6, .navbar-brand { font-family: 'Syne', sans-serif; }

    .navbar { background: var(--ps-dark) !important; }
    .navbar-logo { height: 28px; width: auto; }

    .sidebar { min-height: calc(100vh - 56px); background: var(--ps-dark); }
    .sidebar .nav-link { color: rgba(255,255,255,.55); border-radius: 6px; margin-bottom: 2px; font-family: 'Epilogue', sans-serif; }
    .sidebar .nav-link:hover { color: #fff; background: rgba(255,255,255,.08); }
    .sidebar .nav-link.active { color: #fff; background: var(--ps-primary); }
    .sidebar .nav-link i { width: 20px; }

    .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

    .btn-primary { background-color: var(--ps-primary); border-color: var(--ps-primary); }
    .btn-primary:hover { background-color: #1a6ee0; border-color: #1a6ee0; }
    .btn-outline-primary { color: var(--ps-primary); border-color: var(--ps-primary); }
    .btn-outline-primary:hover { background-color: var(--ps-primary); border-color: var(--ps-primary); }
    a { color: var(--ps-primary); }

    .log-DEBUG { color: #6c757d; }
    .log-INFO { color: var(--ps-primary); }
    .log-WARNING { color: #fd7e14; }
    .log-ERROR { color: #dc3545; }
    .log-CRITICAL { color: #6f42c1; font-weight: 600; }
  </style>
</head>
<body>
<nav class="navbar px-3 d-flex justify-content-between" aria-label="Hauptnavigation">
  <a class="navbar-brand" href="/dashboard">
    <img src="/static/img/logo.svg" alt="PaperSync" class="navbar-logo">
  </a>
  <form method="post" action="/logout" class="m-0">
    <button type="submit" class="btn btn-sm btn-outline-secondary text-white">
      <i class="bi bi-box-arrow-right me-1"></i>Abmelden
    </button>
  </form>
</nav>
<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 sidebar p-3" aria-label="Seitennavigation">
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link {% if request.url.path in ['/', '/dashboard'] %}active{% endif %}" href="/dashboard">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/settings' in request.url.path %}active{% endif %}" href="/settings">
            <i class="bi bi-gear"></i> Einstellungen
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/logs' in request.url.path %}active{% endif %}" href="/logs">
            <i class="bi bi-journal-text"></i> Logs
          </a>
        </li>
      </ul>
    </nav>
    <main class="col-md-10 p-4">
      {% if request.query_params.get('saved') %}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> Einstellungen gespeichert.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endif %}
      {% if request.query_params.get('syncing') %}
      <div class="alert alert-info alert-dismissible fade show" role="alert">
        <i class="bi bi-arrow-repeat"></i> Synchronisation gestartet…
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" integrity="sha384-NrKB+u6Ts6AtkIhwPixiKTzgSKNblyhlk0Sohlgar9UHUBzai/sgnNNWWd291xqt" crossorigin="anonymous"></script>
{% block scripts %}{% endblock %}
</body>
</html>
