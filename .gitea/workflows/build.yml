name: Build and Publish Container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: papersync

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY }}/gitea_max.furch/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=PaperSync
            org.opencontainers.image.description=Synchronizes Papierkram invoices to Paperless-ngx
            org.opencontainers.image.vendor=FurchServices

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.REGISTRY }}/gitea_max.furch/papersync:buildcache
          cache-to: type=registry,ref=${{ vars.REGISTRY }}/gitea_max.furch/papersync:buildcache,mode=max,ignore-error=true

      - name: Validate build
        if: github.event_name != 'pull_request'
        run: |
          docker pull ${{ vars.REGISTRY }}/gitea_max.furch/${{ env.IMAGE_NAME }}:latest
          docker run --rm \
            -e SECRET_KEY="$(python3 -c 'import secrets,base64; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')" \
            -e DATABASE_URL="sqlite:////tmp/test.db" \
            ${{ vars.REGISTRY }}/gitea_max.furch/${{ env.IMAGE_NAME }}:latest \
            python -c "from app.main import app; print('Build validation OK')"
